services:
  pihole-dashboard:
    image: ${DASHBOARD_IMAGE:-ghcr.io/adam-prickett/pihole-fleet:latest}
    container_name: pihole-dashboard
    restart: unless-stopped
    init: true
    ports:
      - "${DASHBOARD_PORT:-3030}:3030"
    # Optional overrides, all empty by default. Set them in Portainer's "Environment variables"
    # section (or a .env file next to this one). Any setting given a value is fixed: the settings
    # page shows it as locked. Left empty, it's managed from the settings page.
    environment:
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}         # e.g. dashboard.lan,10.1.68.0/24
      TRUST_PROXY: ${TRUST_PROXY:-}             # e.g. 1, or 172.16.0.0/12
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-}
      READ_ONLY: ${READ_ONLY:-}
      SESSION_HOURS: ${SESSION_HOURS:-}
      MAX_STREAMS: ${MAX_STREAMS:-}
      RESET_PASSWORD: ${RESET_PASSWORD:-}       # forgot the password? true, redeploy, then clear
    volumes:
      # Settings, the dashboard password hash and Pi-hole instances (with their passwords).
      - pihole-fleet-data:/data
    # Lets the dashboard reach a Pi-hole on this same Docker host as http://host.docker.internal
    # (Linux needs this mapping; Docker Desktop has it built in).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pihole-fleet-data:
