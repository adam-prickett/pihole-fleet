# Pi-hole Fleet Dashboard
#
# Works as-is as a Portainer stack (Stacks -> Add stack -> Web editor) or with `docker compose up -d`;
# no other files or variables are needed.
#
# Open http://<this host>:3030 and add your Pi-holes from the settings (gear icon). A dashboard
# password and allowed hosts are optional and can also be set there. Everything is saved in
# the `pihole-fleet-data` volume.

services:
  pihole-dashboard:
    image: ${DASHBOARD_IMAGE:-ghcr.io/adam-prickett/pihole-fleet:latest}
    container_name: pihole-dashboard
    restart: unless-stopped
    init: true
    ports:
      - "${DASHBOARD_PORT:-3030}:3030"
    # Optional overrides. Any setting given here is fixed: the settings page shows it as locked.
    # environment:
    #   DASHBOARD_PASSWORD: change-me-to-something-long
    #   ALLOWED_HOSTS: dashboard.lan,10.1.68.0/24
    #   TRUST_PROXY: "1"
    #   POLL_INTERVAL_MS: "5000"
    #   READ_ONLY: "false"
    #   SESSION_HOURS: "12"
    #   MAX_STREAMS: "50"
    #   RESET_PASSWORD: "true"   # forgot the password? set, restart (it's cleared), then remove
    volumes:
      # Settings, the dashboard password hash and Pi-hole instances (with their passwords).
      - pihole-fleet-data:/data
    # Lets the dashboard reach a Pi-hole on this same Docker host as http://host.docker.internal
    # (Linux needs this mapping; Docker Desktop has it built in).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pihole-fleet-data:
